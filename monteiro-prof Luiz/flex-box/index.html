<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-box</title>
    <style>
         h1{
            color: rgb(0, 89, 255);
         }
         body{
            font-family: sans-serif;
            background-color: rgb(205, 255, 244);
         }
         .elementoFilho{
            background-color: antiquewhite;
            /*espaçamento interno*/
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            /*largura maxima*/
            max-width: 300px;
         }
         .elementoFilho img{
            width: 100%;
            border-radius: 6px;
         }
         .elementoPai{
            display: flex;
            /*define a direção dos elementos - direita, esquerda*/
            flex-direction: row;
            /*gerar a direção da linha automática*/
            flex-wrap: wrap;
            /*definir espaçamentos*/
            gap: 20px;
            /*centralizar esquerda direita*/
            justify-content: center;
            /*centralizar acima abaixo*/
            align-items: center;
            height: 100vh;
        }
        .preco{
            color: brown;
            font-weight: bold;
        }
        button{
            background-color: rgb(127, 255, 155);
            border: none;
            padding: 10px;
            border-radius: 10px;
            color: darkseagreen;
            box-shadow: 2px 2px 9px black;
        }
        button:hover{
            background-color: black;
            scale: 1.2;
            transition: 1s;
            cursor: pointer;
        }
        
    </style>


</head>
<body>
    <h1> Flex-box</h1>
    <h3 style="color: rgb(25, 175, 163)"> alinhamento </h3>

    <div class="elementoPai">

        <div class="elementoFilho">
            <img src="https://cdn.folhape.com.br/upload/dn_arquivo/2021/10/fiatargosdesigndianteira-21_1.jpeg">
            <h4>Fiat Argo</h4>
            <p> 2022 - flex - 40.000km </p>
            <p class="preco"> R$70.000 </p>
            <button> Comprar </button>
        </div>

        <div class="elementoFilho">
            <img src="https://miamiimports.com.br/wp-content/uploads/2024/11/PORSCHE-911-CARRERA-DIANTEIRA-DIREITA.png">
            <h4>Porshe911</h4>
            <p> 2022 - flex - 100.000km </p>
            <p class="preco"> R$930.000 </p>
            <button> Comprar </button>
        </div>

        <div class="elementoFilho">
            <img src="https://thegarage.com.br/wp-content/uploads/2025/04/2011-Chevrolet-Camaro-SS-a-venda-the-garage-for-sale-37-of-39.jpg">
            <h4>CamaroSS</h4>
            <p> 2022 - flex - 90.000km </p>
            <p class="preco"> R$350.000 </p>
            <button> Comprar </button>
        </div>

        <div class="elementoFilho">
            <img src="https://admin.cnnbrasil.com.br/wp-content/uploads/sites/12/2024/02/cybertruck-1.webp?w=1024">
            <h4>Tesla Cyberpunk</h4>
            <p> 2022 - flex - 400.000km </p>
            <p class="preco"> R$1.350.000</p>
            <button> Comprar </button>
        </div>

        <div class="elementoFilho">
            <img src="https://s2-autoesporte.glbimg.com/i4ruo0C1eHnDzaBKlATt4_FswOU=/0x0:1771x1113/888x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_cf9d035bf26b4646b105bd958f32089d/internal_photos/bs/2023/g/P/6nLcNGRA6FAVRgWrzfpg/ram-1500-limited-0003.jpg">
            <h4>Dodgeram1500</h4>
            <p> 2022 - flex - 400.000km </p>
            <p class="preco"> R$539.000</p>
            <button> Comprar </button>
        </div>








    </div>
</body>
</html>
